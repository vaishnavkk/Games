<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36">
  <!-- Semicircular canals (balance organs) -->
  <!-- Superior canal -->
  <path d="M 14 16 C 14 7 24 7 24 16" fill="none" stroke="#E65100" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Posterior canal -->
  <path d="M 22 14 C 28 14 31 22 24 23" fill="none" stroke="#F57C00" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Horizontal canal -->
  <path d="M 12 18 C 6 18 8 24 14 23" fill="none" stroke="#FB8C00" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Central vestibule chamber -->
  <ellipse cx="18" cy="19" rx="5" ry="4" fill="#FFE0B2" stroke="#E65100" stroke-width="1.5"/>
  <!-- Cochlea (spiral hearing organ) -->
  <path d="M 18 22 C 22 22 25 25 24 28 C 23 31 18 33 15 31 C 12 29 13 25 17 25 C 19 25 20 27 18 28" fill="none" stroke="#E65100" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="18" cy="19" r="1.5" fill="#E65100"/>
</svg>
