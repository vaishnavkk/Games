name: CI

on:
  push:
    branches: [main, cleanup]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_selfplay:
        description: 'Run full selfplay matrix (--full)'
        required: false
        default: true
        type: boolean

env:
  CHROME_PATH: /usr/bin/google-chrome

jobs:
  build-and-test:
    name: Build, Lint, Validate & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: earth-trivia

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: 'earth-trivia/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'earth-trivia/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Lint source code
        run: npm run lint

      - name: Verify Google Chrome
        run: |
          if google-chrome --version; then
            echo "Google Chrome verified at $(which google-chrome)"
          elif which google-chrome-stable; then
            echo "CHROME_PATH=$(which google-chrome-stable)" >> $GITHUB_ENV
            google-chrome-stable --version
          elif which chromium-browser; then
            echo "CHROME_PATH=$(which chromium-browser)" >> $GITHUB_ENV
            chromium-browser --version
          elif which chromium; then
            echo "CHROME_PATH=$(which chromium)" >> $GITHUB_ENV
            chromium --version
          else
            echo "Google Chrome not found; installing via puppeteer..."
            npx puppeteer browsers install chrome
            PUPPETEER_CHROME=$(npx puppeteer browsers installed | grep chrome | head -n1 | awk '{print $2}')
            echo "CHROME_PATH=$PUPPETEER_CHROME" >> $GITHUB_ENV
            "$PUPPETEER_CHROME" --version
          fi

      - name: Check clues
        run: npm run check:clues

      - name: Check palette
        run: npm run check:palette

      - name: Check library (Easy)
        run: npm run check:library -- --tier easy

      - name: Check contrast
        run: npm run check:contrast

      - name: Run test suite
        run: npm test

  selfplay:
    name: Puppeteer Selfplay
    needs: build-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: earth-trivia

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: 'earth-trivia/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'earth-trivia/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Verify Google Chrome
        run: |
          if google-chrome --version; then
            echo "Google Chrome verified at $(which google-chrome)"
          elif which google-chrome-stable; then
            echo "CHROME_PATH=$(which google-chrome-stable)" >> $GITHUB_ENV
            google-chrome-stable --version
          elif which chromium-browser; then
            echo "CHROME_PATH=$(which chromium-browser)" >> $GITHUB_ENV
            chromium-browser --version
          elif which chromium; then
            echo "CHROME_PATH=$(which chromium)" >> $GITHUB_ENV
            chromium --version
          else
            echo "Google Chrome not found; installing via puppeteer..."
            npx puppeteer browsers install chrome
            PUPPETEER_CHROME=$(npx puppeteer browsers installed | grep chrome | head -n1 | awk '{print $2}')
            echo "CHROME_PATH=$PUPPETEER_CHROME" >> $GITHUB_ENV
            "$PUPPETEER_CHROME" --version
          fi

      - name: Run Puppeteer Selfplay
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full_selfplay }}" = "true" ]; then
            npm run selfplay -- --full --workers=2 --ci
          else
            npm run selfplay -- --smoke --ci --workers=2
          fi

      - name: Upload Selfplay Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfplay-summary
          path: |
            earth-trivia/report/selfplay/**/summary.txt
            report/selfplay/**/summary.txt
          if-no-files-found: warn
          retention-days: 7
