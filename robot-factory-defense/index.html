<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Robot Factory Defense</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #111418;
      color: #f1f2f6;
      font-family: 'Chakra Petch', sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    #gameContainer {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #uiRoot {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .interactive {
      pointer-events: auto;
      min-width: 48px;
      min-height: 48px;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="960" height="540"></canvas>
    <div id="uiRoot"></div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
